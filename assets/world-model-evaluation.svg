<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>World-model evaluation: artifact quality and decision utility</title>
<desc>Conceptual summary adapted from Table 7 of Yu et al., 2026. Levels L0–L3 concern artifact quality; levels L4–L7 concern decision utility. These are evidence levels, not a single score.</desc>
